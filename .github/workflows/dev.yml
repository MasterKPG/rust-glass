# Tests pushes to dev. Nothing is published from here.
name: Dev

on:
  push:
    branches: [dev]

concurrency:
  group: dev
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo doc -p rust-glass --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo package -p rust-glass --locked

  # Tests and headless renders on the other desktop platforms. Linux renders
  # through lavapipe, the software Vulkan driver of Mesa. The pictures are
  # attached to the run for comparison with the Windows ones.
  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev mesa-vulkan-drivers
      - run: cargo test --workspace --locked
      - run: cargo run --release --locked -p showcase -- --capture captures
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: captures-${{ runner.os }}
          path: captures
          retention-days: 14
      # Frame budget: the commit before this push and the push itself are
      # timed twice each, in turn, on this runner. Fails when the push is more
      # than 15 percent slower or does more work. The macOS runner draws on
      # its GPU; lavapipe on Linux is too slow to time every page four times.
      - name: Frame budget
        if: runner.os == 'macOS' && github.event.before != '0000000000000000000000000000000000000000'
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          git fetch --no-tags --depth=1 origin "$BEFORE"
          git worktree add --detach ../base "$BEFORE"
          if ! grep -q -- '--bench' ../base/examples/showcase/src/main.rs; then
            echo "::notice::The commit before this push has no frame budget to compare with."
            exit 0
          fi
          cargo build --release --locked -p showcase --manifest-path ../base/Cargo.toml --target-dir target
          cp target/release/showcase base-showcase
          cargo build --release --locked -p showcase
          mkdir -p bench
          for i in 1 2; do
            ./base-showcase --bench bench/base-$i.txt
            target/release/showcase --bench bench/head-$i.txt
          done
          target/release/showcase --compare bench/base-1.txt,bench/base-2.txt bench/head-1.txt,bench/head-2.txt
