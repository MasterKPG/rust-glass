[package]
name = "rust-glass"
description = "GPU rendered Liquid Glass style UI framework with an immediate mode API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/rust-glass"
readme = "../../README.md"
keywords = ["gui", "ui", "glass", "wgpu", "immediate-mode"]
categories = ["gui", "graphics"]

[dependencies]
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "dx12", "metal", "vulkan", "wgsl"] }
winit = "0.30.13"
accesskit = "0.25.2"
accesskit_winit = "0.34.2"
cosmic-text = "0.19"
zeno = "0.3.3"
bytemuck = { version = "1.25", features = ["derive"] }
pollster = "1"
arboard = { version = "3", default-features = false }
unicode-segmentation = "1"
log = "0.4"
